const epoch = Date.UTC(2026,10,2,0,0,0);
const $=id=>document.getElementById(id), video=$('video');
let ytPlayer=null,ytReady=null;
let soundEnabled=false;
let selected=0,powered=true,activeKey='',waitingKey='',tuneVersion=0,ready=false;
const time=t=>new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
function position(channel,now=Date.now()){
 const total=channel.programs.reduce((n,p)=>n+Math.round(p.duration*1000),0);
 const elapsed=now-epoch,offset=((elapsed%total)+total)%total;
 let sum=0;
 for(let i=0;i<channel.programs.length;i++){const p=channel.programs[i];if(offset<sum+Math.round(p.duration*1000)){const start=now-(offset-sum);return {p,index:i,offset:(offset-sum)/1000,start,end:start+Math.round(p.duration*1000),next:channel.programs[(i+1)%channel.programs.length],key:channel.number+':'+i+':'+Math.round(start/1000)}}sum+=Math.round(p.duration*1000)}
}
function render(allowTune=true){
 $('clock').textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit',hour12:false});
 $('date').textContent=new Date().toLocaleDateString([],{weekday:'short',month:'short',day:'numeric',year:'numeric'});
 const c=CHANNELS[selected],s=position(c);
 $('station').textContent='CH '+c.number+' · '+c.name;$('program').textContent=s.p.title;
 $('times').textContent=time(s.start)+' – '+time(s.end);
 $('source').href=s.p.source;
 drawGuide();
 if(allowTune&&powered&&activeKey&&s.key!==activeKey&&s.key!==waitingKey)tune(selected);
}
function seekLive(){const s=position(CHANNELS[selected]);if(s.p.youtube){if(ytPlayer?.seekTo)ytPlayer.seekTo(s.offset,true);return;}const max=Number.isFinite(video.duration)?Math.max(0,video.duration-.25):s.offset;video.currentTime=Math.min(s.offset,max)}
async function play(){try{await video.play();$('status').textContent=''}catch(e){$('status').textContent='Press play on the video to continue.'}}
function tune(index){
 selected=(index+CHANNELS.length)%CHANNELS.length;render(false);if(!window.matchMedia('(max-width:650px)').matches)document.querySelector('.row.selected')?.scrollIntoView({block:'nearest'});if(!powered)return;
 const s=position(CHANNELS[selected]),version=++tuneVersion;activeKey='';waitingKey=s.key;ready=false;
 video.pause();video.muted=!soundEnabled;if(ytPlayer?.stopVideo)ytPlayer.stopVideo();video.hidden=!!s.p.youtube;$('yt-wrap').hidden=!s.p.youtube;
 if(s.p.youtube){tuneYouTube(s,version);return;}
 $('status').textContent='Tuning… Archive tapes may take a moment to load.';
 video.onloadedmetadata=()=>{if(version!==tuneVersion)return;try{seekLive();activeKey=s.key;waitingKey='';ready=true;play()}catch(e){$('status').textContent='Could not seek into this tape. Try another channel or the original source.'}};
 video.onerror=()=>{if(version!==tuneVersion)return;waitingKey='';$('status').textContent='Signal unavailable. Try another channel or the original tape link.'};
 video.src=s.p.url;video.load();
}
const abbreviations=CHANNELS.map(c=>c.short);
let gridStamp='';
function drawGuide(){
 const scrollY=$('channels').parentElement.parentElement.scrollTop;
 const mobile=window.matchMedia('(max-width:650px)').matches;
 const base=Math.floor(Date.now()/1800000)*1800000;
 const stamp=String(mobile)+':'+base+':'+selected+':'+CHANNELS.map(c=>position(c).key).join('|');
 if(stamp===gridStamp)return;gridStamp=stamp;
 $('slots').replaceChildren();
 for(let i=0;i<3;i++){const d=document.createElement('div');d.textContent=mobile?(i===0?'ON NOW':i===1?'UP NEXT':''):time(base+i*1800000);$('slots').append(d)}
 $('channels').replaceChildren();
 CHANNELS.forEach((c,i)=>{
  const row=document.createElement('div');row.className='row'+(i===selected?' selected':'');
  const label=document.createElement('button');label.className='label';label.innerHTML='<span>'+c.number+'</span>'+abbreviations[i];label.setAttribute('aria-label','Tune '+c.name);label.setAttribute('aria-pressed',String(i===selected));label.onclick=()=>tune(i);row.append(label);
  const timeline=document.createElement('div');timeline.className='timeline';let cursor=base; if(mobile){const now=position(c);for(const [p,start,label] of [[now.p,now.start,'Now'],[now.next,now.end,'Next']]){const b=document.createElement('button');b.className='show';const title=document.createElement('span');title.textContent=p.title;const when=document.createElement('small');when.textContent=label+' · '+time(start);b.append(title,when);b.setAttribute('aria-label',label+': '+p.title+'. Tune '+c.name);b.onclick=()=>tune(i);timeline.append(b)}row.append(timeline);$('channels').append(row);return;}  if(['01','02','03','04'].includes(c.number)){const block=document.createElement('button');block.className='show';block.style.width='100%';block.textContent=c.number==='01'?'BCVHS Music Videos & Trailers':c.number==='02'?'Toy Commercials & Trailers':c.number==='04'?'Christmas Commercials: 1987':'Vintage Commercial Breaks';block.onclick=()=>tune(i);timeline.append(block);cursor=base+5400000;}
  while(cursor<base+5400000){const p=position(c,cursor),stop=Math.min(p.end,base+5400000);const cell=document.createElement('button');cell.className='show';cell.style.width=((stop-cursor)/5400000*100)+'%';cell.textContent=(p.start<base?'◀ ':'')+p.p.title+(p.end>base+5400000?' ▶':'');if((stop-cursor)/5400000<.08){cell.style.padding='2px';cell.textContent='·';}cell.title=p.p.title+' · '+time(p.start)+' – '+time(p.end);cell.setAttribute('aria-label',cell.title+'. Tune '+c.name+' live');cell.onclick=()=>tune(i);timeline.append(cell);cursor=stop;}row.append(timeline);$('channels').append(row);
 });
 $('channels').parentElement.parentElement.scrollTop=scrollY;
}
function youtubeAPI(){
 if(window.YT?.Player)return Promise.resolve();
 if(!ytReady)ytReady=new Promise((resolve,reject)=>{const timer=setTimeout(()=>{ytReady=null;reject(Error('YouTube did not load'))},15000);window.onYouTubeIframeAPIReady=()=>{clearTimeout(timer);resolve()};const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';tag.onerror=()=>{clearTimeout(timer);ytReady=null;reject(Error('YouTube unavailable'))};document.head.append(tag)});
 return ytReady;
}
async function tuneYouTube(s,version){
 $('status').textContent='Loading YouTube…';
 try{await youtubeAPI();if(version!==tuneVersion)return;
  const load=()=>{const current=position(CHANNELS[selected]);if(!current.p.youtube)return;if(soundEnabled)ytPlayer.unMute();else ytPlayer.mute();ytPlayer.loadVideoById({videoId:current.p.youtube,startSeconds:current.offset});ytPlayer.playVideo();activeKey=current.key;waitingKey='';ready=true;};
  if(ytPlayer?.loadVideoById){load();return;}
  ytPlayer=new YT.Player('yt-player',{width:'100%',height:'100%',videoId:s.p.youtube,playerVars:{playsinline:1,autoplay:1,mute:1,start:Math.floor(s.offset),origin:location.origin},events:{onReady:()=>{const frame=ytPlayer.getIframe();frame.setAttribute('allow','autoplay; encrypted-media; fullscreen; picture-in-picture');load();},onAutoplayBlocked:()=>{if(!position(CHANNELS[selected]).p.youtube)return;if(ytPlayer.isMuted()){$('status').textContent='Browser blocked muted autoplay. Press play in the video.';return;}ytPlayer.mute();soundEnabled=false;video.muted=true;$('sound').textContent='SOUND ON';$('sound').setAttribute('aria-pressed','false');ytPlayer.playVideo();$('status').textContent='Starting muted…'},onStateChange:e=>{if(!position(CHANNELS[selected]).p.youtube)return;if(e.data===YT.PlayerState.PLAYING)$('status').textContent='';else if(e.data===YT.PlayerState.CUED){ytPlayer.playVideo();}},onError:()=>{if(position(CHANNELS[selected]).p.youtube)$('status').textContent='YouTube video unavailable or embedding blocked. Choose another channel or open the original tape link.'}}});
 }catch(e){if(version===tuneVersion){waitingKey='';$('status').textContent='YouTube could not load. Choose another channel or use the original tape link.'}}
}
$('sound').onclick=()=>{soundEnabled=!soundEnabled;video.muted=!soundEnabled;if(ytPlayer?.mute){if(soundEnabled){ytPlayer.unMute();if(position(CHANNELS[selected]).p.youtube)ytPlayer.playVideo()}else ytPlayer.mute()}$('sound').textContent=soundEnabled?'SOUND OFF':'SOUND ON';$('sound').setAttribute('aria-pressed',String(soundEnabled));if(!position(CHANNELS[selected]).p.youtube)play();};
video.addEventListener('volumechange',()=>{if(position(CHANNELS[selected]).p.youtube)return;soundEnabled=!video.muted&&video.volume>0;$('sound').textContent=soundEnabled?'SOUND OFF':'SOUND ON';$('sound').setAttribute('aria-pressed',String(soundEnabled));});
$('up').onclick=()=>tune(selected+1);$('down').onclick=()=>tune(selected-1);
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(position(CHANNELS[selected]).p.youtube)await $('yt-wrap').requestFullscreen();else if(video.requestFullscreen)await video.requestFullscreen();else if(video.webkitEnterFullscreen)video.webkitEnterFullscreen()}catch(e){$('status').textContent='Use the fullscreen control on the video.'}}
$('fullscreen').onclick=fullscreen;
video.addEventListener('waiting',()=>{if(powered)$('status').textContent='Buffering signal…'});
video.addEventListener('playing',()=>{$('status').textContent=''});
video.addEventListener('ended',()=>{if(ready){$('status').textContent='Tape ended before the scheduled boundary. Retune live or choose another channel.'}});
document.addEventListener('keydown',e=>{if(e.target.closest('video,input,textarea,select')||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowUp'){e.preventDefault();tune(selected+1)}else if(e.key==='ArrowDown'){e.preventDefault();tune(selected-1)}else if(e.key.toLowerCase()==='f')fullscreen();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();if(powered&&ready){try{seekLive()}catch(e){}}}});
window.addEventListener('resize',()=>{gridStamp='';render(false)});render();tune(selected);setInterval(render,1000);
</script></body></html>
